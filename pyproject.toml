[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. The import package (`verso`) and the console
# command (`verso`) are intentionally unchanged.
name = "verso-cli"
dynamic = ["version"]
description = "A terminal co-writer for long-form stories and screenplays, with Markdown, Fountain, and PDF export."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Aadhitya A" }]
keywords = ["cli", "writing", "fiction", "llm", "markdown", "pdf", "fountain", "screenplay", "co-writing", "AI", "novel assistant", "storywriter", "tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.30.0"]
all = ["anthropic>=0.40.0", "openai>=1.30.0"]
dev = ["pytest>=8.0", "ruff>=0.17.0", "packaging>=24.0"]

[project.urls]
Homepage = "https://github.com/ark-7/verso"
Repository = "https://github.com/ark-7/verso"
Issues = "https://github.com/ark-7/verso/issues"
Changelog = "https://github.com/ark-7/verso/blob/main/CHANGELOG.md"

[project.scripts]
verso = "verso.cli:app"

[tool.hatch.version]
path = "src/verso/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verso"]

[tool.hatch.build.targets.sdist]
include = ["src/verso", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ISC", "RUF"]
ignore = [
    "B008",   # Typer's documented Option/Argument-in-defaults pattern
    "UP045",  # Optional[T] keeps Typer's signature inspection unambiguous
    "RUF001", # Deliberate en/em dashes in user-facing prose and prompts
]
