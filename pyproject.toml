[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. The import package (`verso`) and the console
# command (`verso`) are intentionally unchanged.
name = "verso-cli"
version = "0.1.0"
description = "A terminal co-writer for long-form stories, with Markdown and PDF export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GNU General Public License v3.0" }
authors = [{ name = "Aadhitya A" }]
keywords = ["cli", "writing", "fiction", "llm", "markdown", "pdf", "co-writing", "AI", "novel assistant", "storywriter", "tool"]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.30.0"]
all = ["anthropic>=0.40.0", "openai>=1.30.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
verso = "verso.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/verso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ISC", "RUF"]
ignore = [
    "B008",   # Typer's documented Option/Argument-in-defaults pattern
    "UP045",  # Optional[T] keeps Typer's signature inspection unambiguous
    "RUF001", # Deliberate en/em dashes in user-facing prose and prompts
]
